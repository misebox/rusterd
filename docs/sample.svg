<style>
  .canvas { fill: #fff; }
  .entity-bg { fill: #fff; }
  .entity-header { fill: #e0e0e0; }
  .entity-border { fill: none; stroke: #333; stroke-width: 1.5; }
  .entity-separator { stroke: #333; stroke-width: 1; }
