[package]
name = "rusterd"
version = "0.3.0"
edition = "2024"
description = "ER diagram DSL compiler - render ERD to SVG"
license = "MIT"
repository = "https://github.com/misebox/rusterd"
keywords = ["erd", "diagram", "svg", "wasm", "database"]
categories = ["visualization", "wasm"]
exclude = ["demo", "bin", "docs/sample.svg", ".github", "issues.md"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm-api"]
wasm-api = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:console_error_panic_hook",
]

[dependencies]
unicode-width = "0.2"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
