name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # README.md shows this file. Regenerating it must change nothing.
      - run: cargo run -q -- render examples/sample.erd -o docs/sample.svg
      - run: git diff --exit-code docs/sample.svg

      # The browser build is half of what this compiler is for, and it breaks
      # in ways a native build does not notice. The site reads pkg/ as the page
      # does, so building it proves both.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build --target web

      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: site
      - run: bun run build
        working-directory: site
